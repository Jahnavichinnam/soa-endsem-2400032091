
spring.application.name=APIGateway

server.port=8000

# Eureka Configuration
eureka.instance.appname=api-gateway-service
eureka.instance.hostname=localhost

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Order Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=order-service

spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ORDER-SERVICE

spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/order/**

# Remove the /order prefix before forwarding
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Actuator Configuration
management.endpoints.web.exposure.include=*

management.info.env.enabled=true

# Application Information
info.app.name=API Gateway
info.app.description=Order Service Load Balancing Project
info.app.author=Jahnavi
info.app.version=1.0
